name: GLMS CI Pipeline

on:
  push:
    branches: [ master, Part-3 ]
  pull_request:
    branches: [ master, Part-3 ]

jobs:

  # ── Job 1: Unit Tests (runs on both branches) ─────────────────────────────
  test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore GLMS.Web.sln

      - name: Build
        run: dotnet build GLMS.Web.sln --no-restore

      - name: Run Tests
        run: dotnet test GLMS.Web.sln --no-build --verbosity normal

  # ── Job 2: Docker Build Validation (runs on Part-3 only) ──────────────────
  docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Part-3'
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Build API Docker image
        run: docker build -f GLMS.API/Dockerfile -t glms-backend-api .

      - name: Build Web Docker image
        run: docker build -f GLMSwebApp/Dockerfile -t glms-frontend-web .
